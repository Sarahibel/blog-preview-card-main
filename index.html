
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="assets/images/favicon-32x32.png" sizes="32x32"
        href="./assets/images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <title>Frontend Mentor | Blog preview card</title>
</head>

<body>

  <main>
    <article class="card">

      <img class="card-image"
           src="assets/images/illustration-article.svg"
           alt="yellow,white and black abstract illustration">

      <div class="card-content">

        <p class="category">Learning</p>

        <p class="date">Published 21 Dec 2023</p>

        <h1>
          <a href="#">HTML &amp; CSS foundations</a>
        </h1>

        <p class="description">
          These languages are the backbone of every website,
          defining structure, content, and presentation.
        </p>

      </div>

      <div class="author">
        <img src="assets/images/image-avatar.webp"
             alt="Greg Hooper">

        <p>Greg Hooper</p>
      </div>

    </article>
  </main>

  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge">
      Frontend Mentor
    </a>Coded by <a href="#">Sarah Ibelhoulen</a>
  </footer>

</body>
</html>
